# Tellora plans and pricing: the single place to change prices, limits and features.
# The landing page reads this file now; real billing (step 2) will read it later.
# After changing it: commit and push, the deploy picks it up.

trial_months: 7          # free, with every feature (Pro limits)
billing_months: 6        # after the trial, customers pay every 6 months
contact_email: hello@tellora.store

currencies:
  INR: { symbol: "₹", label: "₹ INR" }
  USD: { symbol: "$", label: "$ USD" }

plans:
  - key: starter
    name: Starter
    for: New sellers and home businesses
    price: { INR: 2999, USD: 59 }
    highlights:
      - Up to 100 products
      - Your store at yourname.tellora.store
      - 1 staff account
      - 1 home page theme change a year
      - Every payment gateway, 0% fees

  - key: growth
    name: Growth
    for: Growing brands
    popular: true
    price: { INR: 7999, USD: 149 }
    highlights:
      - Up to 2,000 products
      - Connect your own domain
      - 3 staff accounts
      - 2 home page theme changes a year
      - 3 languages and currencies

  - key: pro
    name: Pro
    for: Established businesses
    price: { INR: 17999, USD: 329 }
    highlights:
      - Unlimited products
      - Your own domain
      - 10 staff accounts
      - 5 home page theme changes a year
      - Unlimited languages and currencies
      - Priority support

  - key: enterprise
    name: Enterprise
    for: Large brands and agencies
    contact: true
    highlights:
      - Everything in Pro
      - Multiple domains
      - Unlimited staff accounts
      - 5 home page theme changes a year
      - A dedicated account manager

# Comparison table under the plan cards. One value per plan key; true = included.
compare:
  - label: Products
    starter: "100"
    growth: "2,000"
    pro: Unlimited
    enterprise: Unlimited
  - label: Store address
    starter: yourname.tellora.store
