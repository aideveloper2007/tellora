# "Included free in every plan" block
included:
  - title: Payments
    items:
      - Razorpay, Cashfree and CCAvenue for India
      - UPI, cards, net banking and wallets
      - Stripe and PayPal for international customers
      - 0% Tellora fee on your sales
  - title: SEO
    items:
      - SEO title and description for every product, category and page
      - Clean, readable web addresses
      - Product details Google can show in search results
      - Fast, mobile-friendly pages with free SSL
  - title: Selling
    items:
      - Product variants like size and colour
      - Discount codes and promotions
      - Customer accounts and wishlists
      - Digital products and bulk product import
  - title: Orders and shipping
    items:
      - Orders, stock and customers in one dashboard
      - PDF invoices and packing slips
      - Shipping zones, rates and taxes
      - Shiprocket for sellers in India
  - title: Marketing
    items:
      - Google Analytics
      - Klaviyo email campaigns
      - Newsletter sign-up on your store
      - Built-in blog
  - title: Design and AI
    items:
      - A store designed by AI from your description
      - Designer style families, ready to switch
      - Changes by chat, no code
      - Starter products with text and photos

